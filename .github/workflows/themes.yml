name: Themes

on:
  pull_request:
    paths:
      - "themes/**"
      - "scripts/**"
      - ".github/workflows/themes.yml"
  push:
    branches: [main]
    paths:
      - "themes/**"
      - "scripts/**"
      - ".github/workflows/themes.yml"
  workflow_dispatch:

concurrency:
  group: themes-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate themes
        run: python scripts/build_themes.py --check

  generate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build themes.json, archives and README gallery
        run: python scripts/build_themes.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: update themes index [skip ci]"
          git pull --rebase --autostash
          git push
